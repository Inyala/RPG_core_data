<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>404 — RPG CORE</title>

<style>
:root{
    --bg:#05070d;
    --panel:#101827;
    --line:#2a3b59;
    --text:#edf4ff;
    --muted:#91a2bd;
    --blue:#61a7ff;
    --purple:#9274ff;
    --red:#ff5368;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at top,#17294a 0%,transparent 45%),
        linear-gradient(180deg,#0b1120,var(--bg));
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:32px 32px;
}

.box{
    position:relative;
    width:min(650px,100%);
    padding:32px 22px 25px;
    text-align:center;
    background:rgba(16,24,39,.97);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 25px 90px rgba(0,0,0,.65);
}

.scan{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:1px;
    background:var(--blue);
    box-shadow:0 0 15px var(--blue);
    animation:scan 5s linear infinite;
}

@keyframes scan{
    from{top:0}
    to{top:100%}
}

.system{
    color:var(--blue);
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
}

.code{
    margin-top:14px;
    font-size:clamp(90px,24vw,170px);
    font-weight:900;
    line-height:.9;
    letter-spacing:-6px;
    color:var(--red);
    text-shadow:
        0 0 20px rgba(255,83,104,.5),
        0 0 60px rgba(255,83,104,.2);
    animation:glitch 4s infinite;
}

@keyframes glitch{
    0%,88%,100%{transform:translate(0)}
    90%{transform:translate(-3px,1px)}
    92%{transform:translate(3px,-1px)}
    94%{transform:translate(-1px,2px)}
}

h1{
    margin:22px 0 10px;
    font-size:24px;
    letter-spacing:2px;
}

p{
    max-width:480px;
    margin:0 auto 22px;
    color:var(--muted);
    line-height:1.6;
}

.status{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    margin-bottom:18px;
    background:#070b14;
    border:1px solid #1d2b43;
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button{
    min-height:46px;
    padding:0 17px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#0a101d;
    color:var(--text);
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    border-color:var(--blue);
}

.primary{
    border:none;
    background:linear-gradient(135deg,var(--blue),var(--purple));
}

.footer{
    margin-top:22px;
    color:#53627b;
    font-size:10px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="box">

<div class="scan"></div>

<div class="system">RPG CORE SYSTEM</div>

<div class="code">404</div>

<h1>RESSOURCE INTROUVABLE</h1>

<p>
La ressource demandée n'existe pas, a été déplacée
ou n'est plus disponible.
</p>

<div class="status" id="status">
Chargement du système audio...
</div>

<div class="buttons">

<button class="primary" onclick="goHome()">
ACCUEIL
</button>

<button onclick="history.back()">
RETOUR
</button>

<button onclick="playRandomSound()">
JOUER LE SON
</button>

</div>

<div class="footer">
RPG CORE • ERROR SYSTEM • 404
</div>

</div>

<script>
"use strict";

const USER = "inyala";
const REPO = "RPG_core_data";
const BRANCH = "main";

const AUDIO_PATH = "mnt/data/RPG_core/audio/se";

const status = document.getElementById("status");

let sounds = [];
let currentAudio = null;

function getApiUrl(path){

    const encodedPath = path
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

    return "https://api.github.com/repos/" +
        USER + "/" +
        REPO + "/contents/" +
        encodedPath +
        "?ref=" +
        encodeURIComponent(BRANCH);
}

function goHome(){

    location.href =
        "https://inyala.github.io/RPG_core_data/mnt/data/RPG_core/";
}

async function loadSounds(){

    try{

        status.textContent =
            "Recherche des fichiers audio...";

        const response = await fetch(
            getApiUrl(AUDIO_PATH),
            {cache:"no-store"}
        );

        if(!response.ok){
            throw new Error(
                "Erreur GitHub API : " +
                response.status
            );
        }

        const files = await response.json();

        sounds = files.filter(file =>
            file.type === "file" &&
            /\.ogg$/i.test(file.name) &&
            file.download_url
        );

        if(!sounds.length){

            status.textContent =
                "Aucun fichier OGG trouvé.";

            return;
        }

        status.textContent =
            sounds.length +
            " sons détectés • Appuie sur JOUER LE SON";

    }catch(error){

        console.error(error);

        status.textContent =
            "Impossible de charger les sons.";
    }
}

function playRandomSound(){

    if(!sounds.length){

        status.textContent =
            "Les sons ne sont pas encore chargés.";

        return;
    }

    if(currentAudio){

        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    const sound =
        sounds[Math.floor(
            Math.random() * sounds.length
        )];

    currentAudio =
        new Audio(sound.download_url);

    currentAudio.volume = 0.7;
    currentAudio.preload = "auto";

    currentAudio.play()
        .then(() => {

            status.textContent =
                "Signal audio activé.";

        })
        .catch(error => {

            console.error(error);

            status.textContent =
                "Lecture impossible. Réessaie.";
        });
}

loadSounds();
</script>

</body>
</html>
