<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RPG Core - Explorateur de fichiers</title>

<style>
:root {
    --bg: #080b12;
    --bg2: #101622;
    --panel: #151d2b;
    --panel-hover: #202b3d;
    --border: #2c3b52;
    --text: #edf3ff;
    --muted: #8fa0ba;
    --accent: #6ca7ff;
    --accent2: #9d7cff;
    --danger: #ff6678;
    --radius: 16px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #17243a 0%, transparent 40%),
        var(--bg);
    color: var(--text);
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(8, 11, 18, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(108, 167, 255, 0.25);
}

h1 {
    margin: 0;
    font-size: 20px;
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

.controls {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px;
}

.search-box {
    display: flex;
    gap: 10px;
}

.search-box input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
}

.search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 167, 255, 0.12);
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 0 18px 30px;
}

.toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

button,
.button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
}

#breadcrumb {
    display: flex;
    gap: 7px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 15px;
    color: var(--muted);
    font-size: 14px;
}

.crumb {
    color: var(--accent);
    cursor: pointer;
}

.crumb:hover {
    text-decoration: underline;
}

#status {
    color: var(--muted);
    padding: 30px 10px;
    text-align: center;
}

.file-list {
    display: grid;
    gap: 8px;
}

.file {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: 0.15s;
}

.file:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
    transform: translateY(-1px);
}

.file-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 22px;
    border-radius: 10px;
    background: #0b1019;
}

.file-info {
    min-width: 0;
    flex: 1;
}

.file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 15px;
}

.file-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
}

.file-actions {
    display: flex;
    gap: 7px;
}

.icon-button {
    width: 38px;
    height: 38px;
    padding: 0;
    display: grid;
    place-items: center;
}

a {
    color: inherit;
    text-decoration: none;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 30px 15px;
    font-size: 12px;
}

.empty {
    padding: 40px 15px;
    text-align: center;
    color: var(--muted);
}

.error {
    border: 1px solid rgba(255, 102, 120, 0.4);
    background: rgba(255, 102, 120, 0.08);
    color: #ff9aa6;
    padding: 15px;
    border-radius: 12px;
}

@media (max-width: 600px) {
    .header-inner {
        padding: 14px;
    }

    main,
    .controls {
        padding-left: 12px;
        padding-right: 12px;
    }

    .file {
        padding: 11px;
        gap: 10px;
    }

    .file-actions {
        flex-direction: column;
    }

    .file-meta {
        display: none;
    }
}
</style>

</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon">⚔️</div>

```
        <div>
            <h1>RPG Core</h1>
            <div class="subtitle">
                Explorateur des ressources
            </div>
        </div>
    </div>
</div>
```

</header>

<div class="controls">
    <div class="search-box">
        <input
            type="search"
            id="search"
            placeholder="Rechercher un fichier dans ce dossier..."
            autocomplete="off"
        >
    </div>
</div>

<main>

```
<div class="toolbar">
    <button id="homeButton">⌂ Accueil</button>
    <button id="backButton">← Retour</button>
    <button id="refreshButton">↻ Actualiser</button>
</div>

<div id="breadcrumb"></div>

<div id="status">
    Chargement des fichiers...
</div>

<div id="fileList" class="file-list"></div>
```

</main>

<footer>
    RPG Core Data • GitHub Explorer
</footer>

<script>
/*
========================================
CONFIGURATION
========================================
*/

const GITHUB_USER = "inyala";
const GITHUB_REPO = "RPG_core_data";
const GITHUB_BRANCH = "main";

/*
Chemin de départ.

"" = racine du dépôt

Exemple :
"mnt/data/RPG_core"
*/

const START_PATH = "mnt/data/RPG_core";


/*
========================================
VARIABLES
========================================
*/

let currentPath = "";
let currentFiles = [];

const searchInput = document.getElementById("search");
const fileList = document.getElementById("fileList");
const status = document.getElementById("status");
const breadcrumb = document.getElementById("breadcrumb");


/*
========================================
OUTILS
========================================
*/

function getApiUrl(path = "") {

    const encodedPath = path
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

    let url =
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

    if (encodedPath) {
        url += "/" + encodedPath;
    }

    url += `?ref=${encodeURIComponent(GITHUB_BRANCH)}`;

    return url;
}


function getPagesUrl(path = "") {

    const cleanPath = path
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

    let url =
        `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;

    if (cleanPath) {
        url += cleanPath;
    }

    return url;
}


function formatSize(bytes) {

    if (bytes === undefined || bytes === null) {
        return "";
    }

    const units = [
        "o",
        "Ko",
        "Mo",
        "Go"
    ];

    let size = bytes;
    let unit = 0;

    while (
        size >= 1024 &&
        unit < units.length - 1
    ) {
        size /= 1024;
        unit++;
    }

    return (
        size.toFixed(
            unit === 0 ? 0 : 1
        ) +
        " " +
        units[unit]
    );
}


function getFileIcon(file) {

    if (file.type === "dir") {
        return "📁";
    }

    const name = file.name.toLowerCase();

    if (
        name.endsWith(".png") ||
        name.endsWith(".jpg") ||
        name.endsWith(".jpeg") ||
        name.endsWith(".webp") ||
        name.endsWith(".gif")
    ) {
        return "🖼️";
    }

    if (
        name.endsWith(".mp3") ||
        name.endsWith(".ogg") ||
        name.endsWith(".wav") ||
        name.endsWith(".m4a")
    ) {
        return "🎵";
    }

    if (
        name.endsWith(".json")
    ) {
        return "{}";
    }

    if (
        name.endsWith(".js")
    ) {
        return "JS";
    }

    if (
        name.endsWith(".html")
    ) {
        return "HTML";
    }

    if (
        name.endsWith(".css")
    ) {
        return "CSS";
    }

    if (
        name.endsWith(".zip")
    ) {
        return "📦";
    }

    if (
        name.endsWith(".txt")
    ) {
        return "📄";
    }

    return "📄";
}


function getParentPath(path) {

    const parts =
        path.split("/").filter(Boolean);

    parts.pop();

    return parts.join("/");
}


/*
========================================
BREADCRUMB
========================================
*/

function renderBreadcrumb() {

    breadcrumb.innerHTML = "";

    const root = document.createElement("span");

    root.className = "crumb";
    root.textContent = "RPG_core_data";

    root.onclick = function() {
        loadDirectory("");
    };

    breadcrumb.appendChild(root);

    if (!currentPath) {
        return;
    }

    const parts =
        currentPath.split("/").filter(Boolean);

    let builtPath = "";

    parts.forEach((part) => {

        const separator =
            document.createElement("span");

        separator.textContent = "›";

        breadcrumb.appendChild(separator);

        builtPath =
            builtPath
                ? builtPath + "/" + part
                : part;

        const item =
            document.createElement("span");

        item.className = "crumb";
        item.textContent = part;

        const targetPath = builtPath;

        item.onclick = function() {
            loadDirectory(targetPath);
        };

        breadcrumb.appendChild(item);
    });
}


/*
========================================
AFFICHAGE DES FICHIERS
========================================
*/

function renderFiles(files = currentFiles) {

    fileList.innerHTML = "";

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const filtered =
        files.filter((file) => {

            return file.name
                .toLowerCase()
                .includes(search);
        });

    if (filtered.length === 0) {

        fileList.innerHTML = `
            <div class="empty">
                Aucun fichier trouvé.
            </div>
        `;

        return;
    }

    filtered.forEach((file) => {

        const item =
            document.createElement("div");

        item.className = "file";

        const icon =
            getFileIcon(file);

        const info =
            file.type === "dir"
                ? "Dossier"
                : formatSize(file.size);

        item.innerHTML = `
            <div class="file-icon">
                ${icon}
            </div>

            <div class="file-info">

                <div
                    class="file-name"
                    title="${escapeHtml(file.name)}"
                >
                    ${escapeHtml(file.name)}
                </div>

                <div class="file-meta">
                    ${info}
                </div>

            </div>

            <div class="file-actions">

                <button
                    class="icon-button open-button"
                    title="Ouvrir"
                >
                    ↗
                </button>

                <button
                    class="icon-button copy-button"
                    title="Copier le lien"
                >
                    ⧉
                </button>

            </div>
        `;

        const openButton =
            item.querySelector(".open-button");

        const copyButton =
            item.querySelector(".copy-button");


        /*
        OUVRIR
        */

        openButton.onclick =
        function(event) {

            event.stopPropagation();

            if (file.type === "dir") {

                loadDirectory(file.path);

            } else {

                window.open(
                    getPagesUrl(file.path),
                    "_blank"
                );
            }
        };


        /*
        CLIQUER SUR LA LIGNE
        */

        item.onclick = function() {

            if (file.type === "dir") {

                loadDirectory(file.path);

            } else {

                window.open(
                    getPagesUrl(file.path),
                    "_blank"
                );
            }
        };


        /*
        COPIER LE LIEN
        */

        copyButton.onclick =
        async function(event) {

            event.stopPropagation();

            const url =
                getPagesUrl(file.path);

            try {

                await navigator.clipboard.writeText(url);

                copyButton.textContent = "✓";

                setTimeout(
                    function() {
                        copyButton.textContent = "⧉";
                    },
                    1200
                );

            } catch (error) {

                prompt(
                    "Copie ce lien :",
                    url
                );
            }
        };


        fileList.appendChild(item);
    });
}


/*
========================================
SÉCURITÉ HTML
========================================
*/

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
========================================
CHARGEMENT GITHUB API
========================================
*/

async function loadDirectory(path = "") {

    currentPath = path;

    currentFiles = [];

    searchInput.value = "";

    fileList.innerHTML = "";

    status.style.display = "block";

    status.innerHTML =
        "Chargement des fichiers...";

    renderBreadcrumb();

    try {

        const response =
            await fetch(
                getApiUrl(path)
            );

        if (!response.ok) {

            if (response.status === 404) {

                throw new Error(
                    "Dossier introuvable."
                );
            }

            if (response.status === 403) {

                throw new Error(
                    "Limite de l'API GitHub atteinte. Réessaie plus tard."
                );
            }

            throw new Error(
                "Erreur HTTP " +
                response.status
            );
        }

        const data =
            await response.json();


        /*
        SI C'EST UN FICHIER
        */

        if (!Array.isArray(data)) {

            window.open(
                getPagesUrl(data.path),
                "_blank"
            );

            return;
        }


        /*
        TRI :
        DOSSIERS D'ABORD
        */

        currentFiles =
            data.sort(
                function(a, b) {

                    if (
                        a.type === "dir" &&
                        b.type !== "dir"
                    ) {
                        return -1;
                    }

                    if (
                        a.type !== "dir" &&
                        b.type === "dir"
                    ) {
                        return 1;
                    }

                    return a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );
                }
            );

        status.style.display = "none";

        renderFiles();

        document.title =
            currentPath
                ? currentPath.split("/").pop() +
                  " - RPG Core"
                : "RPG Core - Explorateur";


        /*
        MET À JOUR L'URL
        */

        const url =
            new URL(
                window.location.href
            );

        if (currentPath) {

            url.searchParams.set(
                "path",
                currentPath
            );

        } else {

            url.searchParams.delete(
                "path"
            );
        }

        history.pushState(
            {
                path: currentPath
            },
            "",
            url
        );

    } catch (error) {

        status.style.display = "none";

        fileList.innerHTML = `
            <div class="error">

                <strong>
                    Impossible de charger les fichiers.
                </strong>

                <br><br>

                ${escapeHtml(error.message)}

                <br><br>

                Vérifie la configuration :

                <br>

                Utilisateur :
                ${escapeHtml(GITHUB_USER)}

                <br>

                Dépôt :
                ${escapeHtml(GITHUB_REPO)}

                <br>

                Branche :
                ${escapeHtml(GITHUB_BRANCH)}

            </div>
        `;
    }
}


/*
========================================
RECHERCHE
========================================
*/

searchInput.addEventListener(
    "input",
    function() {
        renderFiles();
    }
);


/*
========================================
BOUTON ACCUEIL
========================================
*/

document
    .getElementById("homeButton")
    .addEventListener(
        "click",
        function() {
            loadDirectory("");
        }
    );


/*
========================================
BOUTON RETOUR
========================================
*/

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function() {

            if (!currentPath) {
                return;
            }

            loadDirectory(
                getParentPath(currentPath)
            );
        }
    );


/*
========================================
ACTUALISER
========================================
*/

document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        function() {

            loadDirectory(
                currentPath
            );
        }
    );


/*
========================================
BOUTON RETOUR NAVIGATEUR
========================================
*/

window.addEventListener(
    "popstate",
    function() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const path =
            params.get("path") || "";

        loadDirectory(path);
    }
);


/*
========================================
DÉMARRAGE
========================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const savedPath =
    urlParams.get("path");

const initialPath =
    savedPath !== null
        ? savedPath
        : START_PATH;

loadDirectory(initialPath);
</script>

</body>
  </html>
