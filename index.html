<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG Core - Ressources</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#111;color:#eee}
h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#222;padding:10px;border-radius:8px}.card img{width:100%;height:140px;object-fit:cover;border-radius:5px}
small{color:#aaa}code{background:#000;padding:3px 6px;border-radius:4px}
</style>
</head>
<body>
<h1>RPG Core - Ressources</h1>
<p>Le fichier <code>actu.json</code> est prêt à être utilisé par TurboWarp.</p>
<div id="contenu">Chargement...</div>
<script>
fetch("./actu.json").then(r=>r.json()).then(data=>{
 const images=data[0]||[];
 const liens=data[1]||[];
 document.getElementById("contenu").innerHTML=
 "<h2>Images prédéfinies</h2><div class='grid'>"+
 images.map((url,i)=>"<div class='card'><img src='"+url+"' alt='Image "+(i+1)+"'><small>Index "+(i+1)+"</small></div>").join("")+
 "</div><h2>Liens prédéfinis</h2><pre>"+JSON.stringify(liens,null,2)+"</pre>";
}).catch(e=>{
 document.getElementById("contenu").textContent="Erreur de lecture de actu.json : "+e.message;
});
</script>
</body>
</html>
